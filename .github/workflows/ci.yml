name: Blogger API CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Week_7_Blogger_API/blogger-api/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'Week_7_Blogger_API/blogger-api/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Week_7_Blogger_API/blogger-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Week_7_Blogger_API/blogger-api/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test --if-present
